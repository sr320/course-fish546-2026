name: "🔬 Project Proposal"
description: Your quarter-long research project and your home base for the whole course (one per student).
title: "[project] <your name> — <short project title>"
labels: ["project"]
body:
  - type: markdown
    attributes:
      value: |
        **One issue per student, opened in Week 0 or 1.** This is your home base for the quarter:

        - Every week, post the **commit link** to your notebook entry here as a comment. The instructor replies in the thread.
        - Paste each **tutorial completion block** here as a comment.
        - Edit the top post as your project evolves. A rough draft is fine to start.

        Details: [How We Work](https://sr320.github.io/course-fish546-2026/how-we-work.html).
  - type: input
    id: repo
    attributes:
      label: Your course repository
      description: Created from the project template, in the course organization.
      placeholder: "https://github.com/course-fish546-2026/<your-repo>"
    validations:
      required: true
  - type: textarea
    id: question
    attributes:
      label: Research question / objective
      description: What are you trying to find out?
    validations:
      required: true
  - type: dropdown
    id: track
    attributes:
      label: Project track
      options:
        - RNA-seq / differential gene expression
        - eDNA / metabarcoding
        - DNA methylation / epigenetics
        - Variants / population genomics
        - Annotation / assembly / sequence discovery
        - Other (describe below)
    validations:
      required: true
  - type: textarea
    id: data
    attributes:
      label: Data
      description: What data will you use? Source, size, format, and whether it already exists.
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Where will the heavy lifting run?
      options:
        - Raven (RStudio Server)
        - Hyak / Klone (batch)
        - Own computer
        - Mix (describe below)
    validations:
      required: true
  - type: textarea
    id: endpoint
    attributes:
      label: Endpoint / "ultimate figure"
      description: What does "done" look like? Describe the final figure or result you're driving toward.
    validations:
      required: true
  - type: textarea
    id: risks
    attributes:
      label: Anticipated challenges
      description: Where do you expect to get stuck (data access, compute, methods)?
