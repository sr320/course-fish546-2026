name: "🆘 Help Request (I'm stuck)"
description: Ask for help on a specific problem — the right way to get unstuck fast.
title: "[help] <one-line summary of the problem>"
labels: ["help"]
body:
  - type: markdown
    attributes:
      value: |
        A good help request gets a fast answer. Tell us **what you expected**, **what happened**, and **what you already tried**. Check the [Roberts Lab Handbook](https://robertslab.github.io/resources/) first.
  - type: dropdown
    id: platform
    attributes:
      label: Which platform?
      options:
        - Own computer
        - Raven
        - Hyak / Klone
        - GitHub / Git
        - Not sure
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: What are you trying to do?
    validations:
      required: true
  - type: textarea
    id: tried
    attributes:
      label: What have you already tried?
      description: Show us — include the exact command(s) you ran.
    validations:
      required: true
  - type: textarea
    id: error
    attributes:
      label: Exact error message / output
      description: Copy-paste the full text (not a screenshot of text). On Klone, include the job ID and the tail of slurm-*.out.
      render: text
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce (if it fails the same way every time)
      description: Numbered steps someone else could follow to see the same failure. Include software versions or the container hash if relevant.
  - type: input
    id: link
    attributes:
      label: Link to the relevant commit, file, or log
      placeholder: "https://github.com/course-fish546-2026/<your-repo>/blob/<sha>/..."
