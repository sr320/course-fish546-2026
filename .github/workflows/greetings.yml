name: Greet first issue

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  greeting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/first-interaction@v1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          issue-message: |
            👋 Thanks for opening your first issue in FISH 546!

            A few reminders:
            - Your **Project Proposal** issue is your home base: post each week's commit link there as a comment.
            - For quick questions use [Slack](https://genefish.slack.com); if you're stuck, the [Roberts Lab Handbook](https://robertslab.github.io/resources/) is your first stop.
            - Good Help Requests show **what you tried** and the **exact error text** — that gets you a faster answer.
            - How everything fits: [How We Work](https://sr320.github.io/course-fish546-2026/how-we-work.html).
